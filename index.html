<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Search Console verification -->
  <meta name="google-site-verification" content="uq3XFSB5FIQP9A_HXkL4UxX1mICIVeHnHNfZnokt0ms">

  <!-- Primary SEO -->
  <title>Join Tahanan Natin | Cavite Real Estate Recruitment</title>
  <meta name="description" content="Join Tahanan Natin's real estate project-selling team in Cavite. Explore a commission-based opportunity with training, guidance, flexible scheduling, and a qualification process for aspiring property sales agents.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#0F1D3A">
  <meta name="author" content="Tahanan Natin">

  <!-- Canonical -->
  <link rel="canonical" href="https://tahanan-natin-recruitment.vercel.app/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tahanan Natin">
  <meta property="og:title" content="Join Tahanan Natin | Cavite Real Estate Recruitment">
  <meta property="og:description" content="Explore a commission-based real estate project-selling opportunity in Cavite with training, guidance, flexible scheduling, and a qualification process.">
  <meta property="og:url" content="https://tahanan-natin-recruitment.vercel.app/">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Join Tahanan Natin | Cavite Real Estate Recruitment">
  <meta name="twitter:description" content="Explore a commission-based real estate project-selling opportunity in Cavite with training, guidance, flexible scheduling, and a qualification process.">

  <!-- AEO / GEO: recruitment identity -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Tahanan Natin",
    "url": "https://tahanan-natin-recruitment.vercel.app/",
    "description": "Tahanan Natin is a Cavite-focused real estate project-selling recruitment opportunity for people interested in commission-based property sales.",
    "areaServed": {
      "@type": "AdministrativeArea",
      "name": "Cavite, Philippines"
    }
  }
  </script>

  <!-- AEO / GEO: website identity -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Tahanan Natin Recruitment",
    "url": "https://tahanan-natin-recruitment.vercel.app/",
    "description": "Tahanan Natin's Cavite real estate recruitment landing page."
  }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8f4ed;
    }

    #app {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #f8f4ed;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f4ed;
      font-family: Arial, sans-serif;
      color: #1a2d5a;
      z-index: 10;
      transition: opacity 0.2s ease;
    }

    .loader {
      text-align: center;
      padding: 24px;
    }

    .loader strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .loader span {
      font-size: 14px;
      opacity: 0.8;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 15px;
      border: 4px solid #ddd;
      border-top-color: #1a2d5a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fallback {
      display: none;
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px;
      font-family: Arial, sans-serif;
      color: #172033;
      line-height: 1.7;
    }

    .fallback h1 {
      color: #0f1d3a;
      margin-bottom: 12px;
    }

    .fallback p {
      color: #68758a;
    }

    noscript .fallback {
      display: block;
    }
  </style>
</head>

<body>

  <div id="loading" aria-live="polite">
    <div class="loader">
      <div class="spinner" aria-hidden="true"></div>
      <strong>Loading Tahanan Natin...</strong>
      <span>Cavite Real Estate Recruitment</span>
    </div>
  </div>

  <!-- Actual recruitment page hosted by Google Apps Script -->
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbzGqLV7Jqt3CNjkB0QhvBe6EOUfKBwVrU5Yc11q5khVkwNjfjJwfWxWaYwo3eF6fuYLWA/exec"
    title="Tahanan Natin Cavite Real Estate Recruitment"
    allow="clipboard-write"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <noscript>
    <div class="fallback">
      <h1>Join Tahanan Natin | Cavite Real Estate Recruitment</h1>
      <p>Tahanan Natin is recruiting people interested in commission-based real estate project selling in Cavite.</p>
      <p>The opportunity is not a fixed-salary job. It is designed for people who are willing to learn, sell, follow up with prospects, and build results through successful real estate transactions.</p>
      <p>The current recruitment screening focuses on applicants in Cavite, including applicants near Molino, Bacoor.</p>
      <p>Please enable JavaScript to view the full recruitment page and qualification process.</p>
    </div>
  </noscript>

  <script>
    (function () {
      const iframe = document.getElementById('app');
      const loading = document.getElementById('loading');

      function hideLoading() {
        if (!loading) return;
        loading.style.opacity = '0';
        setTimeout(function () {
          loading.style.display = 'none';
        }, 220);
      }

      if (iframe) {
        iframe.addEventListener('load', hideLoading);
        setTimeout(hideLoading, 12000);
      }
    })();
  </script>

</body>
</html>
