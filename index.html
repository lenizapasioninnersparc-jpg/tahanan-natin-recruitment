
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tahanan Natin Recruitment | Join Our Team</title>

  <meta name="description" content="Join the Tahanan Natin Cavite recruitment team. Discover opportunities and apply to become part of our growing real estate team.">

  <link rel="canonical" href="https://tahanan-natin-recruitment.vercel.app/">

  <meta property="og:title" content="Tahanan Natin Recruitment">
  <meta property="og:description" content="Explore recruitment opportunities with Tahanan Natin Cavite.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tahanan-natin-recruitment.vercel.app/">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8f4ed;
    }

    #app {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f4ed;
      font-family: Arial, sans-serif;
      color: #1a2d5a;
      z-index: 10;
    }

    .loader {
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 15px;
      border: 4px solid #ddd;
      border-top-color: #1a2d5a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loader">
      <div class="spinner"></div>
      <div>Loading Tahanan Natin Recruitment...</div>
    </div>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbzGqLV7Jqt3CNjkB0QhvBe6EOUfKBwVrU5Yc11q5khVkwNjfjJwfWxWaYwo3eF6fuYLWA/exec"
    allow="clipboard-write"
    title="Tahanan Natin Recruitment"
  ></iframe>

  <script>
    const iframe = document.getElementById('app');
    const loading = document.getElementById('loading');

    iframe.addEventListener('load', function() {
      loading.style.display = 'none';
    });
  </script>

</body>
</html>
